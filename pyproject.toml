[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinema-language-mobility"
version = "0.1.0"
description = "Temporal network analysis of cross-language career entry in Indian cinema"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "requests>=2.31", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cinema-mobility = "cinema_mobility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
